<main class="mx-auto flex min-h-screen xl:max-w-7xl flex-col gap-6 bg-surface-muted p-6 font-sans text-slate-900">
  <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <h1 class="text-2xl font-semibold">Projection</h1>
    <div class="flex items-center gap-2 text-sm text-slate-500">
      <label class="flex flex-col gap-1">
        From
        <input
          type="date"
          class="rounded-lg border border-outline bg-surface px-3 py-1.5 text-slate-900"
          [value]="periodStart()"
          (change)="onPeriodStartChange($event)"
        />
      </label>
      <label class="flex flex-col gap-1">
        To
        <input
          type="date"
          class="rounded-lg border border-outline bg-surface px-3 py-1.5 text-slate-900"
          [value]="periodEnd()"
          (change)="onPeriodEndChange($event)"
        />
      </label>
    </div>
  </header>

  @if (periodChartData.error()) {
    <app-alert>
      {{ errorMessage() }}
    </app-alert>
  } @else if (periodChartData.isLoading()) {
    <p class="text-sm text-slate-500">Loading...</p>
  } @else if (periodChartData.value(); as chartData) {
    <section class="rounded-xl border border-outline bg-surface p-4 shadow-sm">
      <app-balance-chart [points]="chartData.balanceProjection" />
    </section>
  }
</main>
